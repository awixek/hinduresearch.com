    opacity:0; transform:translateY(16px); animation:cardIn 0.6s ease forwards;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
  .article-card:hover{ border-color:var(--gold); transform:translateY(-3px); }
  .article-tag{

<header>
  <p class="eyebrow">शोध और अध्ययन</p>
  <h1>लेख (Articles)</h1>
  <p class="subtitle">प्राचीन भारतीय विज्ञान, वेद, गणित, चिकित्सा और खगोलशास्त्र पर गहन शोध — हर लेख के पीछे की पूरी कहानी यहाँ पढ़ें।</p>
</header>

<main>
  <div class="grid" id="articleGrid"></div>

  <div class="load-more-wrap">
    <button id="loadMoreBtn" onclick="loadMore()">और लेख देखें (Load More)</button>
  </div>
  <p class="end-note" id="endNote" style="display:none;">आपने सभी लेख पढ़ लिए हैं। जल्द ही और लेख जोड़े जाएंगे।</p>
</main>

<footer>
  <div class="footer-rule"></div>
  <a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    मुख्य पृष्ठ पर वापस जाएँ
  </a>
</footer>

<script>
  // Every article listed here is a real, crawlable page (SEO-safe: no hidden/JS-only content).
  // "Load More" reveals already-present cards in batches for better UX on large lists,
  // while every article link still exists in the page HTML and in sitemap.xml.
  const articles = [
    {
      tag: "प्राचीन विज्ञान",
      title: "आर्यभट्ट ने शून्य और पाई (π) की खोज कैसे की?",
      desc: "शून्य की अवधारणा, पाई का सटीक मान और पृथ्वी के घूर्णन से जुड़ी आर्यभट्ट की अद्भुत खोजों की पूरी कहानी।",
      url: "aryabhata-zero-pi-discovery.html"
    },
    {
      tag: "आयुर्वेद और चिकित्सा",
      title: "सुश्रुत: दुनिया के पहले सर्जन की कहानी",
      desc: "सुश्रुत संहिता, प्राचीन प्लास्टिक सर्जरी और मोतियाबिंद ऑपरेशन की तकनीकों की विस्तृत जानकारी।",
      url: "sushruta-father-of-surgery.html"
    }
    // आगे नए लेख यहीं इस पैटर्न में जोड़े — { tag, title, desc, url }
  ];

  const grid = document.getElementById('articleGrid');
  const batchSize = 6;
  let shown = 0;

  function renderBatch(){
    const next = articles.slice(shown, shown + batchSize);
    next.forEach((a, i) => {
      const card = document.createElement('a');
      card.className = 'article-card';
      card.href = a.url;
      card.style.animationDelay = (0.05 * i) + 's';
      card.innerHTML = `
        <span class="article-tag">${a.tag}</span>
        <h2 class="article-title">${a.title}</h2>
        <p class="article-desc">${a.desc}</p>
        <span class="article-readmore">पूरा लेख पढ़ें →</span>
      `;
      grid.appendChild(card);
    });
    shown += next.length;

    const btn = document.getElementById('loadMoreBtn');
    if(shown >= articles.length){
      btn.style.display = 'none';
      document.getElementById('endNote').style.display = 'block';
    }
  }

  function loadMore(){ renderBatch(); }

  renderBatch();
</script>

</body>
