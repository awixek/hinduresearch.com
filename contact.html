<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Hindu Research Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.7; color: #2d3748; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #fdfbf7; }
        .container { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); border-top: 5px solid #d97706; }
        h1 { color: #b45309; font-size: 2rem; margin-bottom: 10px; }
        p { font-size: 1rem; margin-bottom: 15px; }
        .contact-info { background-color: #fffbeb; border-left: 4px solid #f59e0b; padding: 20px; margin: 20px 0; border-radius: 6px; }
        .contact-info-item { margin-bottom: 12px; font-size: 1rem; }
        .contact-info-item strong { color: #b45309; }
        .contact-info-item a { color: #d97706; text-decoration: none; font-weight: 600; }
        .contact-info-item a:hover { text-decoration: underline; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #4a5568; }
        input[type="text"], input[type="email"], textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        textarea { height: 120px; resize: vertical; }
        button { background-color: #d97706; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #b45309; }
        .back-link { display: inline-block; margin-top: 25px; color: #d97706; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
    <link rel="icon" type="image/png" href="images/fevicon.png">
    
</head>
<body>

<div class="container">
    <h1>Contact Us</h1>
    <p>Have questions, feedback, or scriptural references you'd like to share? We would love to hear from you!</p>

    <div class="contact-info">
        <div class="contact-info-item">
            <strong>Direct Email:</strong> <a href="mailto:ay5890573@gmail.com">ay5890573@gmail.com</a>
        </div>
        <div class="contact-info-item">
            <strong>Instagram:</strong> <a href="https://instagram.com/xyz2ak" target="_blank">@xyz2ak</a>
        </div>
        <div class="contact-info-item">
            <strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/abhishek-yadav-a5531b393" target="_blank">Abhishek Yadav Profile</a>
        </div>
    </div>

    <h2>Send Us a Message</h2>
    <form action="#" method="POST" onsubmit="alert('Thank you for your message! We will get back to you soon.'); return false;">
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label for="email">Your Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="What is this regarding?" required>
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
        </div>
        <button type="submit">Submit Message</button>
    </form>

    <a href="index.html" class="back-link">← Back to Main Portal</a>
</div>

</body>
              </html>
