<style>
  :root{
    --charcoal:#1f1a17;
    --charcoal-soft:#2b2420;
    --beige:#f3e9dc;
    --beige-deep:#e8d9c3;
    --orange:#d97b3f;

    --maps-green-dark:#256340;

  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(217,123,63,0.08), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(199,154,75,0.10), transparent 50%),
      var(--beige);
    font-family:"Georgia","Noto Sans Devanagari","Segoe UI",sans-serif;
    color:var(--charcoal);
  }

  /* ---------- Header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:100;
    background:linear-gradient(135deg,#241d19,#352a22 55%,#241d19);
    border-bottom:3px solid var(--gold);
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }

  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:0.3px;
    background:linear-gradient(90deg,var(--orange-soft),var(--gold) 60%,var(--orange-soft));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:700;
  }

  header h1 .sub{
    display:block;
    font-size:0.78rem;
    color:#cbb89a;
    font-weight:400;
    letter-spacing:1.5px;
    margin-top:2px;
    -webkit-text-fill-color:#cbb89a;
  }

  .back-btn{
    flex-shrink:0;
    text-decoration:none;
    background:rgba(217,123,63,0.12);
    color:var(--orange-soft);
    border:1.5px solid var(--orange);
    padding:10px 18px;
    border-radius:999px;
    font-size:0.92rem;
    font-weight:600;
    transition:all 0.25s ease;
    white-space:nowrap;
  }
  .back-btn:hover{
    background:var(--orange);
    color:#1f1a17;
    transform:translateY(-1px);
  }

  /* ---------- Lang Toggle ---------- */
  .lang-toggle{
    display:flex;
    align-items:center;
    flex-shrink:0;
    background:rgba(243,233,220,0.08);
    border:1.5px solid var(--gold);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .lang-toggle button{
    border:none;
    background:transparent;
    color:#cbb89a;
    font-weight:700;
    font-size:0.85rem;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all 0.25s ease;
    font-family:inherit;
  }
  .lang-toggle button.active{
    background:linear-gradient(135deg,var(--orange),var(--gold));
    color:#1f1a17;
  }

  /* ---------- Tabs (page-to-page navigation) ---------- */
  .tab-zone{
    padding:26px 24px 0;
    max-width:760px;
    margin:0 auto;
    text-align:center;
  }
  .tabs{
    display:inline-flex;
    background:#fffaf3;
    border:1.5px solid var(--beige-deep);
    border-radius:999px;
    padding:4px;
    gap:4px;
    box-shadow:0 4px 14px rgba(31,26,23,0.06);
  }
  .tab-btn{
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-weight:700;
    font-size:0.95rem;
    padding:11px 24px;
    border-radius:999px;
    cursor:pointer;
    transition:all 0.25s ease;
    font-family:inherit;
    white-space:nowrap;
    text-decoration:none;
    display:inline-block;
  }
  .tab-btn.active{
    background:linear-gradient(135deg,var(--orange),var(--gold));
    color:#1f1a17;
    box-shadow:0 4px 12px rgba(217,123,63,0.35);
  }

  /* ---------- Search ---------- */
  .search-zone{
    padding:22px 24px 10px;
    max-width:760px;
    margin:0 auto;
    text-align:center;
  }
  .search-zone p.tagline{
    color:var(--text-muted);
    font-style:italic;
    margin:0 0 18px;
    font-size:0.95rem;
  }

  .search-wrap{
    position:relative;
  }

  #searchInput{
    width:100%;
    padding:15px 50px 15px 22px;
    font-size:1.05rem;
    border-radius:14px;
    border:2px solid var(--beige-deep);
    background:#fffaf3;
    color:var(--charcoal);
    outline:none;
    box-shadow:inset 0 1px 4px rgba(0,0,0,0.05);
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
    font-family:inherit;
  }
  #searchInput:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 4px rgba(217,123,63,0.15);
  }
  .search-icon{
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    font-size:1.2rem;
    pointer-events:none;
    opacity:0.6;
  }

  #resultCount{
    margin-top:10px;
    font-size:0.85rem;
    color:var(--amber);
    font-weight:600;
    letter-spacing:0.4px;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:26px;
    padding:30px 24px 80px;
    max-width:1320px;
    margin:0 auto;
  }

  @media (max-width:980px){
    .grid{grid-template-columns:repeat(2, 1fr);}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:1fr; padding:24px 16px 60px;}
    header{padding:14px 16px;}
    header h1{font-size:1.15rem;}
    .tab-btn{padding:10px 16px; font-size:0.88rem;}
  }

  /* ---------- Card ---------- */
  .card{
    background:#fffdf9;
    border:1px solid var(--beige-deep);
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 4px 14px rgba(31,26,23,0.06);
    transition:transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
  }
  .card:hover{
    transform:translateY(-5px);
    box-shadow:0 14px 30px rgba(217,123,63,0.18);
    border-color:var(--orange-soft);
  }

  .card-image{
    height:190px;
    overflow:hidden;
    position:relative;
    background:linear-gradient(135deg, var(--amber), var(--orange) 50%, var(--gold));
  }
  .card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.35s ease;
  }
  .card:hover .card-image img{
    transform:scale(1.04);
  }
  .card-image .place-no{
    position:absolute;
    top:10px;
    left:12px;
    background:rgba(31,26,23,0.60);
    color:#f3e9dc;
    font-size:0.72rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    letter-spacing:0.5px;
    z-index:1;
  }

  .card-body{
    padding:18px 20px 20px;
    display:flex;
    flex-direction:column;
    flex:1;
  }

  .card-body h2{
    margin:0 0 4px;
    font-size:1.12rem;
    color:var(--charcoal);
    line-height:1.35;
  }

  .card-body .fact{
    font-size:0.82rem;
    color:var(--orange);
    font-weight:700;
    letter-spacing:0.2px;
    margin-bottom:12px;
    line-height:1.5;
  }
  .card-body .fact .fact-label{
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-size:0.72rem;
    color:var(--amber);
    display:block;
    margin-bottom:3px;
  }

  .card-body .desc{
    font-size:0.91rem;
    line-height:1.65;
    color:#3c352f;
    margin-bottom:18px;
    flex:1;
  }

  .learn-btn{
    margin-top:auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:linear-gradient(135deg, var(--maps-green), var(--maps-green-dark));
    color:#fdfdfd;
    text-decoration:none;
    padding:11px 16px;
    border-radius:10px;
    font-weight:700;
    font-size:0.9rem;
    transition:filter 0.2s ease, transform 0.2s ease;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }
  .learn-btn:hover{
    filter:brightness(1.08);
    transform:translateY(-1px);
  }

  .no-results{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
    font-size:1.05rem;
    grid-column:1 / -1;
  }

  footer{
    text-align:center;
    padding:22px;
    color:var(--text-muted);
    font-size:0.82rem;
    border-top:1px solid var(--beige-deep);
  }

  .header-links{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">ध्यान विज्ञान: दर्शन एवं साधना
    <span class="sub">MEDITATION — VEDIC SCIENCE</span>
  </h1>
  <div class="lang-toggle" id="langToggle">
    <button type="button" id="btnHi" class="active" onclick="setLang('hi')">हिं</button>
    <button type="button" id="btnEn" onclick="setLang('en')">EN</button>
  </div>
  <div class="header-links">
    <a class="back-btn" id="backBtn" href="index.html">⬅️ मुख्य पोर्टल पर वापस जाएं</a>
  </div>
</header>

<div class="tab-zone">
  <div class="tabs" id="tabZone">
    <a href="yoga.html" id="tabYoga" class="tab-btn">🧘 <span id="tabYogaLabel">योग व आसन</span></a>
    <a href="meditation.html" id="tabMeditation" class="tab-btn active">🧘‍♂️ <span id="tabMeditationLabel">ध्यान व साधना</span></a>
  </div>
</div>

<div class="search-zone">
  <p class="tagline" id="tagline">15 शोध-आधारित ध्यान साधनाएं — वैदिक विज्ञान की दृष्टि से</p>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="ध्यान तकनीक खोजें...">
    <span class="search-icon">🔍</span>
  </div>
  <div id="resultCount"></div>
</div>

<div class="grid" id="cardGrid"></div>

<footer id="footerText">Hindu Research Portal &mdash; ध्यान का वैज्ञानिक संकलन</footer>

<script src="yogaData.js"></script>
<script>
const grid = document.getElementById('cardGrid');
const searchInput = document.getElementById('searchInput');
const resultCount = document.getElementById('resultCount');

let currentLang = 'hi';
const PAGE_CATEGORY = 'Meditation';

const uiText = {
  hi: {
    pageTitle: "ध्यान विज्ञान: दर्शन एवं साधना",
    tagline: "15 शोध-आधारित ध्यान साधनाएं — वैदिक विज्ञान की दृष्टि से",
    placeholder: "ध्यान तकनीक खोजें...",
    backBtn: "⬅️ मुख्य पोर्टल पर वापस जाएं",
    footer: "Hindu Research Portal — ध्यान का वैज्ञानिक संकलन",
    noResults: "😔 कुछ नहीं मिला। कृपया दूसरा शब्द खोजें।",
    resultCount: " परिणाम मिले",
    learnBtn: "और जानें",
    tabYoga: "योग व आसन",
    tabMeditation: "ध्यान व साधना",
    factLabel: "वैज्ञानिक तथ्य"
  },
  en: {
    pageTitle: "Meditation Science: Practices & Sadhana",
    tagline: "15 research-backed Meditation practices — through the lens of Vedic science",
    placeholder: "Search a meditation technique...",
    backBtn: "⬅️ Back to Main Portal",
    footer: "Hindu Research Portal — A Scientific Collection of Meditation",
    noResults: "😔 Nothing found. Please try another search term.",
    resultCount: " results found",
    learnBtn: "Learn More",
    tabYoga: "Yoga & Asanas",
    tabMeditation: "Meditation & Sadhana",
    factLabel: "Research Fact"
  }
};

function buildSearchUrl(query){
  return "https://www.google.com/search?q=" + encodeURIComponent(query);
}

function pageData(){
  return yogaMeditationData.filter(function(item){ return item.category === PAGE_CATEGORY; });
}

function renderCards(list){
  grid.innerHTML = "";
  const t = uiText[currentLang];

  if(list.length === 0){
    grid.innerHTML = '<div class="no-results">' + t.noResults + '</div>';
    resultCount.textContent = "";
    return;
  }

  list.forEach(function(item){
    const card = document.createElement('div');
    card.className = 'card';
    const title = currentLang === 'hi' ? item.title_hi : item.title_en;
    const desc = currentLang === 'hi' ? item.desc_hi : item.desc_en;
    const fact = currentLang === 'hi' ? item.fact_hi : item.fact_en;

    card.innerHTML =
      '<div class="card-image">' +
        '<span class="place-no">#' + item.id + '</span>' +
        '<img src="images/meditation(' + item.id + ').jpg"' +
             ' alt="' + title + '"' +
             ' onerror="this.style.display=\'none\'">' +
      '</div>' +
      '<div class="card-body">' +
        '<h2>' + title + '</h2>' +
        '<div class="fact"><span class="fact-label">' + t.factLabel + '</span>' + fact + '</div>' +
        '<p class="desc">' + desc + '</p>' +
        '<a class="learn-btn" href="' + buildSearchUrl(item.query) + '" target="_blank" rel="noopener noreferrer">' +
          '🔍 ' + t.learnBtn +
        '</a>' +
      '</div>';

    grid.appendChild(card);
  });

  resultCount.textContent = list.length + t.resultCount;
}

function filterData(){
  const term = searchInput.value.trim().toLowerCase();
  const base = pageData();

  if(term === ""){
    renderCards(base);
    return;
  }

  const filtered = base.filter(function(item){
    const title = currentLang === 'hi' ? item.title_hi : item.title_en;
    const desc = currentLang === 'hi' ? item.desc_hi : item.desc_en;
    const fact = currentLang === 'hi' ? item.fact_hi : item.fact_en;
    return title.toLowerCase().includes(term) ||
           desc.toLowerCase().includes(term) ||
           fact.toLowerCase().includes(term);
  });

  renderCards(filtered);
}

function setLang(lang){
  currentLang = lang;
  const t = uiText[lang];

  document.getElementById('btnHi').classList.toggle('active', lang === 'hi');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  document.getElementById('pageTitle').childNodes[0].nodeValue = t.pageTitle + " ";
  document.getElementById('tagline').textContent = t.tagline;
  searchInput.placeholder = t.placeholder;
  document.getElementById('backBtn').textContent = t.backBtn;
  document.getElementById('footerText').textContent = t.footer;
  document.getElementById('tabYogaLabel').textContent = t.tabYoga;
  document.getElementById('tabMeditationLabel').textContent = t.tabMeditation;
  document.documentElement.lang = lang;

  filterData();
}

searchInput.addEventListener('input', filterData);

renderCards(pageData());
</script>

</body>
