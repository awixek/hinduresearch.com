const grid = document.getElementById('cardGrid');
const searchInput = document.getElementById('searchInput');
const resultCount = document.getElementById('resultCount');

let currentLang = 'hi';

const uiText = {
  hi: {
    pageTitle: "रहस्यमयी और प्रसिद्ध हिंदू स्थल",
    tagline: "भारत के 50 रहस्यमयी और पवित्र स्थलों का संग्रह",
    placeholder: "स्थान या रहस्य खोजें...",
    backBtn: "⬅️ मुख्य पोर्टल पर वापस जाएं",
    footer: "Hindu Research Portal — सनातन धरोहर संकलन",
    noResults: "😔 कोई स्थान नहीं मिला। कृपया दूसरा शब्द खोजें।",
    resultCount: " स्थान मिले",
    mapsBtn: "गूगल मैप्स पर देखें"
  },
  en: {
    pageTitle: "Mysterious & Famous Hindu Sites",
    tagline: "A collection of 50 mysterious and sacred sites of India",
    placeholder: "Search a place or mystery...",
    backBtn: "⬅️ Back to Main Portal",
    footer: "Hindu Research Portal — Sanatan Heritage Collection",
    noResults: "😔 No place found. Please try another search term.",
    resultCount: " places found",
    mapsBtn: "View on Google Maps"
  }
};

function buildMapsUrl(query){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
}

function renderCards(list){
  grid.innerHTML = "";
  const t = uiText[currentLang];

  if(list.length === 0){
    grid.innerHTML = '<div class="no-results">' + t.noResults + '</div>';
    resultCount.textContent = "";
    return;
  }

  list.forEach(function(place, index){
    const card = document.createElement('div');
    card.className = 'card';
    const imgNum = index + 1;
    const desc = currentLang === 'hi' ? place.desc_hi : place.desc_en;

    card.innerHTML =
      '<div class="card-image">' +
        '<span class="place-no">#' + imgNum + '</span>' +
        '<img src="images/place(' + imgNum + ').jpg"' +
             ' alt="' + place.name + '"' +
             ' onerror="this.style.display=\'none\'">' +
      '</div>' +
      '<div class="card-body">' +
        '<h2>' + place.name + '</h2>' +
        '<div class="state">' + place.state + '</div>' +
        '<p class="desc">' + desc + '</p>' +
        '<a class="maps-btn" href="' + buildMapsUrl(place.query) + '" target="_blank" rel="noopener noreferrer">' +
          '<img src="images/map-pin.png" alt="" class="map-pin-icon">' + t.mapsBtn +
        '</a>' +
      '</div>';

    grid.appendChild(card);
  });

  resultCount.textContent = list.length + t.resultCount;
}

function filterPlaces(){
  const term = searchInput.value.trim().toLowerCase();

  if(term === ""){
    renderCards(hinduPlaces);
    return;
  }

  const filtered = hinduPlaces.filter(function(place){
    const desc = currentLang === 'hi' ? place.desc_hi : place.desc_en;
    return place.name.toLowerCase().includes(term) ||
           place.state.toLowerCase().includes(term) ||
           desc.toLowerCase().includes(term);
  });

  renderCards(filtered);
}

function setLang(lang){
  currentLang = lang;
  const t = uiText[lang];

  document.getElementById('btnHi').classList.toggle('active', lang === 'hi');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  document.getElementById('pageTitle').childNodes[0].nodeValue = t.pageTitle + " ";
  document.getElementById('tagline').textContent = t.tagline;
  searchInput.placeholder = t.placeholder;
  document.getElementById('backBtn').textContent = t.backBtn;
  document.getElementById('footerText').textContent = t.footer;
  document.documentElement.lang = lang;

  filterPlaces();
}

searchInput.addEventListener('input', filterPlaces);

renderCards(hinduPlaces);
</script>
